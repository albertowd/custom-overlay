sonar.projectKey=custom-overlay
sonar.projectName=Custom Overlay
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=packages/core/src,packages/ui/src,packages/cli/src,apps/desktop/src,apps/pwa/src,apps/pwa/vite.config.ts
sonar.tests=packages/core/test,packages/ui/test,packages/cli/test,apps/desktop/test,apps/pwa/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/out/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
# A template the build completes; its tests run the generated sw.js in a sandbox (apps/pwa/test/workers).
sonar.coverage.exclusions=apps/pwa/src/service-worker.js

sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/ui/coverage/lcov.info,packages/cli/coverage/lcov.info,apps/desktop/coverage/lcov.info,apps/pwa/coverage/lcov.info

