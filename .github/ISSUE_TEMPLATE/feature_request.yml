name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet, or want feedback first? Start in [Discussions](https://github.com/albertowd/custom-overlay/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, not the solution. E.g. "show the delta to my best lap on a bike video".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you tried
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Videos / data sources (new logger or format)
        - Sync
        - Track / timing
        - Widgets
        - Values / scripts
        - Export / rendering
        - CLI
        - Other
