# Local SonarQube for static analysis (development only: uses the embedded H2 database).
#   npm run sonar:up      start SonarQube on http://localhost:9000
#   npm run sonar:scan    run the tests with coverage, then analyse the project (needs SONAR_TOKEN)
#   npm run sonar:down    stop everything (analysis history is kept in volumes)
name: custom-overlay

services:
  sonarqube:
    image: sonarqube:community
    environment:
      # Avoids the vm.max_map_count requirement of the embedded Elasticsearch on Docker Desktop / WSL.
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", 'curl -fs http://localhost:9000/api/system/status | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles: ["scan"]
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      # Create a token in SonarQube (My Account > Security) and export it as SONAR_TOKEN.
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src
    working_dir: /usr/src

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
